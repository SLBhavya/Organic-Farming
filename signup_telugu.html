<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create an Account</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="signup-container">
        <h2>ఖాతాను సృష్టించండి</h2>
        <form>
            <label for="email">ఇమెయిల్ చిరునామా:</label>
            <input type="email" id="email" name="email" required>
            <label for="username">వినియోగదారు పేరు:</label>
            <input type="text" id="username" name="username" required>
            <label for="password">పాస్వర్డ్:</label>
            <input type="password" id="password" name="password" required>
            <label for="confirm-password">పాస్వర్డ్ను నిర్ధారించండి:</label>
            <input type="password" id="confirm-password" name="confirm-password" required>
            <button type="submit">ఖాతాను సృష్టించండి</button>
        </form>
    </div>
</body>
</html>
